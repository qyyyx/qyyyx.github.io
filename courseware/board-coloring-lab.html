<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>棋盘染色实验室</title>
  <link rel="icon" href="data:,">
  <style>
/* 棋盘染色实验室 —— 数学实验室型 UI（浅色、白卡片、品牌蓝） */
:root {
  color-scheme: light;
  --bg: #f4f7f8;
  --surface: #ffffff;
  --surface-strong: #eef4f5;
  --line: #d7e1e3;
  --text: #152529;
  --muted: #66777d;
  --accent: #3b82f6;
  --accent-dark: #2563eb;
  --accent-soft: #dbeafe;
  --warning: #c47a1c;
  --warn-soft: #fdf3e2;
  --good: #15803d;
  --good-soft: #dcfce7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --shadow: 0 18px 50px rgba(30, 52, 60, 0.10);

  /* 棋盘染色的四种色阶（与讲义灰阶对应，但用更适合投屏的中性色） */
  --cell-0: #ffffff;
  --cell-1: #94a3b8;
  --cell-2: #cbd5e1;
  --cell-3: #64748b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; }
h1, h2, h3, h4, p, dl, dd, dt { margin: 0; }

/* ================= 骨架 ================= */
.lab-shell {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr) 330px;
  gap: 16px;
  width: 100%;
  min-height: 100vh;
  padding: 16px;
}
.lab-nav, .data-panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.lab-nav { border-right: 1px solid var(--line); padding-right: 16px; }
.workbench { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.brand-block { padding: 4px 2px 8px; }
.brand-kicker, .section-label, .panel-label, .prompt-label {
  color: var(--accent-dark); font-size: 12px; font-weight: 700; letter-spacing: .04em;
}
.brand-block h1 { font-size: 23px; line-height: 1.2; margin-top: 6px; }
.brand-sub { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.6; }

.module-list { display: flex; flex-direction: column; gap: 6px; }
.module-item {
  display: flex; align-items: center; gap: 10px;
  min-height: 42px; padding: 8px 10px;
  border: 1px solid transparent; border-radius: 10px;
  background: transparent; color: var(--text);
  text-align: left; cursor: pointer; font-size: 13.5px;
}
.module-item:hover { background: var(--surface); border-color: var(--line); }
.module-item.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); font-weight: 700; }
.module-index { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.module-item.active .module-index { color: var(--accent-dark); }
.module-item .done-dot { margin-left: auto; color: var(--good); font-size: 12px; }

.ach-block { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }

.lab-header {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  flex-wrap: wrap;
}
.lab-header h2 { font-size: 22px; margin-top: 4px; }
.status-strip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }

.stage-scroll { flex: 1; min-height: 0; }
.prompt-panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px;
}
#promptText { margin-top: 5px; font-size: 13.5px; color: var(--muted); line-height: 1.7; }

/* ================= 通用卡片 / 控件 ================= */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px;
}
.card + .card { margin-top: 12px; }
.card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-body { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.75; }
.card-body strong { color: var(--text); }

.tool-button {
  min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--text); cursor: pointer;
  font-size: 13.5px;
}
.tool-button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }
.tool-button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.tool-button.primary:hover { background: var(--accent-dark); }
.tool-button:disabled { opacity: .45; cursor: default; }
.tool-button.is-locked {
  border-style: dashed; color: var(--muted); background: var(--surface-strong);
}
/* 门禁也可以套在一整组控件上（如武器库芯片组） */
.chip-grid.is-locked { opacity: .5; }
.chip-grid.is-locked .color-chip { border-style: dashed; }
.lock-tag {
  display: inline-flex; align-items: center;
  font-size: 12px; color: var(--warning); margin-left: 6px; white-space: nowrap;
}

.rack { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rack + .rack { margin-top: 10px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 12px;
  background: var(--surface-strong); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warning); }

/* ================= 棋盘 ================= */
.board-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.board {
  display: grid; gap: 0;
  border: 2px solid #334155; background: #334155;
  border-radius: 4px; overflow: hidden;
  touch-action: manipulation; user-select: none;
  width: min(100%, var(--board-max, 460px));
}
.cell {
  position: relative; aspect-ratio: 1 / 1;
  border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;
  background: var(--cell-0);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(9px, 2.1vw, 14px); color: #1e293b;
  font-variant-numeric: tabular-nums;
  cursor: default;
}
.board.clickable .cell { cursor: pointer; }
.cell.c0 { background: var(--cell-0); }
.cell.c1 { background: var(--cell-1); }
.cell.c2 { background: var(--cell-2); }
.cell.c3 { background: var(--cell-3); }
.cell.c1, .cell.c3 { color: #f8fafc; }
.cell.hole { background: repeating-linear-gradient(45deg, #e2e8f0 0 5px, #f1f5f9 5px 10px); }
.cell.hole::after { content: '✕'; color: #94a3b8; font-size: 12px; }

/* 骨牌层：半透明覆盖，让底下的染色仍然看得见（教学关键） */
.cell .piece-layer { position: absolute; inset: 0; pointer-events: none; }
.cell.occupied .piece-layer { background: var(--pc, #3b82f6); opacity: .34; }
.cell .piece-edge { position: absolute; inset: 0; pointer-events: none; }
.cell.edge-t .piece-edge { border-top: 3px solid var(--pcl, #1d4ed8); }
.cell.edge-r .piece-edge { border-right: 3px solid var(--pcl, #1d4ed8); }
.cell.edge-b .piece-edge { border-bottom: 3px solid var(--pcl, #1d4ed8); }
.cell.edge-l .piece-edge { border-left: 3px solid var(--pcl, #1d4ed8); }

.cell.ghost .piece-layer { background: #3b82f6; opacity: .30; }
.cell.ghost-bad .piece-layer { background: #ef4444; opacity: .30; }
.cell.spot { outline: 3px solid var(--warning); outline-offset: -3px; z-index: 2; }
.cell.dim { opacity: .35; }

.board-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-size: 12px; color: var(--muted); }
.swatch { display: inline-block; width: 13px; height: 13px; border: 1px solid #94a3b8; vertical-align: -2px; margin-right: 4px; border-radius: 2px; }

/* ================= 骨牌选择器 / 迷你图 ================= */
.mini { display: inline-grid; gap: 1px; vertical-align: middle; }
.mini i { width: 9px; height: 9px; background: #cbd5e1; border-radius: 1px; display: block; }
.mini i.on { background: var(--accent); }
.piece-chip {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  cursor: pointer; font-size: 13px;
}
.piece-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }

/* ================= 染色芯片（武器库） ================= */
.chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.color-chip {
  min-height: 40px; padding: 8px 6px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;
  font-size: 12px; line-height: 1.3; color: var(--text);
}
.color-chip:hover { border-color: var(--accent); }
.color-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
.color-chip.hit { border-color: var(--good); }
.color-chip .swatch-mini { display: grid; grid-template-columns: repeat(4, 7px); gap: 1px; }
.color-chip .swatch-mini i { width: 7px; height: 7px; display: block; border-radius: 1px; }
.color-chip .mark { font-size: 11px; }

/* ================= 矛盾探测器 ================= */
.detector { font-size: 13px; }
.detector .row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 7px 0; border-bottom: 1px dashed var(--line);
}
.detector .row:last-child { border-bottom: 0; }
.detector .k { color: var(--muted); font-size: 12.5px; }
.detector .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.detector .piece-row { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.detector .piece-row .name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
.detector .piece-row .vals { margin-top: 5px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
.sample-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
  padding: 2px 8px; font-size: 12px; cursor: pointer; margin: 2px 4px 0 0;
  font-variant-numeric: tabular-nums; min-height: 26px;
}
.sample-btn:hover { border-color: var(--warning); color: var(--warning); }

.verdict { margin-top: 12px; padding: 11px 12px; border-radius: 10px; font-size: 13px; line-height: 1.75; }
.verdict.win { background: var(--good-soft); color: #14532d; border: 1px solid #86efac; }
.verdict.miss { background: var(--warn-soft); color: #7c4a08; border: 1px solid #fcd9a0; }

/* ================= 揭晓 / 预测 ================= */
.reveal-box { margin-top: 12px; }
.reveal-body {
  display: none; margin-top: 10px; padding: 12px;
  background: var(--surface-strong); border-radius: 10px;
  font-size: 13px; line-height: 1.8;
}
.reveal-box.show .reveal-body { display: block; }
.reveal-placeholder { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.reveal-box.show .reveal-placeholder { display: none; }

.predict-box { border: 1px solid var(--accent-soft); background: #f8fbff; border-radius: 12px; padding: 12px 14px; }
.predict-box.flash { animation: flash 1s ease 2; }
@keyframes flash { 0%,100% { background: #f8fbff; } 50% { background: #ffeccc; } }
.predict-q { font-size: 13.5px; font-weight: 600; }
.opt-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.opt {
  min-height: 40px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13.5px;
}
.opt.chosen { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
.opt:disabled { cursor: default; }
.predict-feedback { margin-top: 9px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }

/* ================= 关卡条 ================= */
.level-bar { display: flex; flex-wrap: wrap; gap: 8px; }
.level-btn {
  min-height: 40px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-size: 13px; display: inline-flex; align-items: center; gap: 7px;
}
.level-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
.level-btn .tick { color: var(--good); }

/* ================= 概念卡 / 小测 ================= */
.concept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.concept {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface);
  cursor: pointer;
}
.concept .tag { font-size: 11px; color: var(--accent-dark); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
.concept h4 { margin-top: 8px; font-size: 14px; }
.concept .txt { display: none; margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.75; }
.concept.open .txt { display: block; }
.concept .hintline { margin-top: 8px; font-size: 12px; color: var(--muted); }
.concept.open .hintline { display: none; }

.quiz-item { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.quiz-item:last-child { border-bottom: 0; }
.quiz-q { font-size: 13.5px; font-weight: 600; line-height: 1.7; }
.quiz-opts { display: flex; flex-direction: column; gap: 7px; margin-top: 9px; }
.quiz-opt {
  text-align: left; min-height: 40px; padding: 8px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; line-height: 1.6;
}
.quiz-opt.right { border-color: var(--good); background: var(--good-soft); }
.quiz-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz-opt:disabled { cursor: default; }

/* ================= 沙盘 ================= */
.slider-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.slider-row input[type=range] { flex: 1; min-width: 110px; height: 40px; }
.slider-row .val { min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.recipe-row {
  display: flex; align-items: center; gap: 8px; padding: 7px 0;
  border-bottom: 1px dashed var(--line); font-size: 13px;
}
.recipe-row:last-child { border-bottom: 0; }
.recipe-row .nm { flex: 1; display: flex; align-items: center; gap: 7px; }
.step-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1;
}
.step-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.recipe-row .n { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ================= 弹窗 ================= */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 30, 40, .45);
  display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 999;
}
/* 作者样式的 display:flex 会盖过 UA 的 [hidden]{display:none}，必须显式收回 */
.modal-mask[hidden] { display: none; }
.modal-card {
  background: var(--surface); border-radius: 14px; padding: 18px;
  width: min(560px, 100%); max-height: 82vh; overflow: auto; box-shadow: var(--shadow);
}
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.modal-head h3 { font-size: 16px; }
.ach-list { display: flex; flex-direction: column; gap: 8px; }

/* ================= 响应式 ================= */
@media (max-width: 1099px) {
  .lab-shell { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 12px; }
  .lab-nav { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .module-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .module-item { flex: 0 0 auto; white-space: nowrap; }
  .ach-block { margin-top: 4px; flex-direction: row; align-items: center; }
  .ach-progress-track { flex: 1; }
  .brand-block h1 { font-size: 20px; }
  .brand-sub { display: none; }
}
@media (max-width: 700px) {
  .lab-shell { padding: 10px; }
  .lab-header h2 { font-size: 18px; }
  .chip-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .board { --board-max: 100%; }
  .concept-grid { grid-template-columns: minmax(0, 1fr); }
}


/*
 * achievements.css —— 成就系统底座配套样式
 * 配合 achievements.js 使用；可整段内联进单 HTML。
 * 颜色沿用数学实验室型变量（品牌蓝 #3b82f6 / 浅色卡片），无变量时有兜底值。
 */

/* ---- toast 解锁提示（右下角堆叠） ---- */
.ach-toast-stack {
  position: fixed;
  right: 16px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
  pointer-events: none;
}
.ach-toast {
  min-width: 220px;
  max-width: 300px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--surface, #ffffff);
  border: 1px solid var(--line, #d7e1e3);
  border-left: 4px solid var(--accent, #3b82f6);
  box-shadow: 0 6px 20px rgba(15, 30, 40, 0.12);
  animation: ach-toast-in 0.25s ease-out;
}
.ach-toast-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--accent-dark, #2563eb);
  font-weight: 600;
}
.ach-toast-name {
  margin-top: 4px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text, #152529);
}
.ach-toast-desc {
  margin-top: 2px;
  font-size: 12px;
  color: var(--muted, #66777d);
}
@keyframes ach-toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---- 奖杯进度条（在任意位置放 [data-ach-progress] 的轨道即可） ---- */
.ach-progress-track {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-strong, #eef4f5);
  overflow: hidden;
}
.ach-progress-track > [data-ach-progress] {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: var(--accent, #3b82f6);
  transition: width 0.3s ease;
}

/* ---- 成就清单行（奖杯弹窗内） ---- */
.ach-row {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line, #d7e1e3);
  background: var(--surface, #ffffff);
  opacity: 0.55;
}
.ach-row.is-unlocked { opacity: 1; border-color: var(--accent-soft, #dbeafe); }
.ach-row .ach-icon { font-size: 22px; text-align: center; }
.ach-row .ach-name { font-weight: 600; color: var(--text, #152529); }
.ach-row .ach-desc { font-size: 12px; color: var(--muted, #66777d); }
.ach-row .ach-status {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted, #66777d);
  white-space: nowrap;
}
.ach-row.is-unlocked .ach-status { color: var(--accent-dark, #2563eb); }

/* 触控目标：奖杯入口按钮不小于 40px */
.ach-trophy-btn {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--line, #d7e1e3);
  background: var(--surface, #ffffff);
  color: var(--text, #152529);
  cursor: pointer;
}

<body>
  <main class="lab-shell">
    <!-- ============ 左栏：模块导航 ============ -->
    <aside class="lab-nav" aria-label="模块导航">
      <div class="brand-block">
        <p class="brand-kicker">Math Lab</p>
        <h1>棋盘染色实验室</h1>
        <p class="brand-sub">用一把「不变量」的刀，把「铺不满」证死</p>
      </div>
      <nav class="module-list" id="moduleList"></nav>
      <div class="ach-block">
        <button class="ach-trophy-btn" type="button" id="trophyBtn">
          🏆 成就 <span data-ach-count>0</span>/<span data-ach-total>0</span>
        </button>
        <div class="ach-progress-track"><span data-ach-progress></span></div>
      </div>
    </aside>

    <!-- ============ 中栏：工作台 ============ -->
    <section class="workbench">
      <header class="lab-header">
        <div>
          <p class="section-label" id="modKicker">实验 00</p>

  // =========================================================================
  // 2. 多格骨牌与朝向
  // =========================================================================
  var PIECES = [

    { id: 'tri-I', name: '1×3 长条', glyph: '▬', cells: [[0, 0], [0, 1], [0, 2]] },
    { id: 'tri-L', name: 'L 形三连方', glyph: '⌐', cells: [[0, 0], [1, 0], [1, 1]] },
    { id: 'tet-O', name: '2×2 方块', glyph: '■', cells: [[0, 0], [0, 1], [1, 0], [1, 1]] },

    { id: 'tet-L', name: 'L 形四连方', glyph: 'L', cells: [[0, 2], [1, 0], [1, 1], [1, 2]] },
    { id: 'tet-T', name: 'T 形四连方', glyph: 'T', cells: [[0, 1], [1, 0], [1, 1], [1, 2]] },

  /** 平移到左上角并按行序排序，作为朝向的唯一标准形 */

  // =========================================================================

  /**

      var allParity = specs.every(function (s) { return s.spec.perColor[j].parity !== null; });

      if (!hit) {
        if (allConst) {
          var parts = specs.map(function (s) {
            return s.count + ' 个「' + s.name + '」每个必吃 ' + s.spec.perColor[j].constant + ' 个';
          });
          reason = {
            type: 'constant',
            text: parts.join('，') + '，合计必然是 ' + reach[0] + ' 个「' + label +
              '」格；可是棋盘上「' + label + '」格有 ' + actual + ' 个。' + reach[0] + ' ≠ ' + actual + '，矛盾！'
          };
        } else if (allParity) {
          var pSum = 0, pParts = [];
          specs.forEach(function (s) {
            var p = s.spec.perColor[j].parity;
            pSum += p * s.count;
            pParts.push(s.count + ' 个「' + s.name + '」每个吃' + (p ? '奇' : '偶') + '数个');
          });
          var want = pSum % 2;
          reason = {
            type: 'parity',
            text: pParts.join('，') + '，所以总数必为' + (want ? '奇' : '偶') + '数；可是棋盘上「' + label +
              '」格有 ' + actual + ' 个，是' + (actual % 2 ? '奇' : '偶') + '数。奇 ≠ 偶，矛盾！'
          };
        } else {

          reason = {
            type: 'reachable',
            text: '把每块能吃的「' + label + '」格数逐一枚举、再全部相加，能凑出的总数只有 ' +
              (reach.length <= 8 ? '{' + reach.join(', ') + '}' : lo + ' 到 ' + hi + ' 之间的 ' + reach.length + ' 个值') +
              '；棋盘实际有 ' + actual + ' 个，凑不出来，矛盾！'
          };

        index: j, label: label, actual: actual, reachable: reach, contradiction: !hit,
        perPiece: specs.map(function (s) { return { pieceId: s.pieceId, name: s.name, count: s.count, info: s.spec.perColor[j] }; }),

    // best = 讲给学生听时最省力的那条：恒定值 > 奇偶性 > 可达集；

    var rank = { constant: 0, parity: 1, reachable: 2 };

        W: cfg.W, H: cfg.H, coloring: c.id, recipe: cfg.recipe,
        allowFlip: cfg.allowFlip, blocked: cfg.blocked

  // =========================================================================
  // 5. 穷举求解器（找构造 / 诚实地证明「真的搜遍了」）
  // =========================================================================
  /**

   * @returns {{solved:boolean, placements:Array, nodes:number, exhausted:boolean}}

  function solve(cfg) {

    var budget = cfg.budget || 4000000;

    var types = cfg.recipe.map(function (it) {
      return { pieceId: it.pieceId, left: it.count, orients: orientations(it.pieceId, allowFlip) };
    });
    var free = W * H - (cfg.blocked ? cfg.blocked.length : 0);
    var need = cfg.recipe.reduce(function (a, it) { return a + getPiece(it.pieceId).cells.length * it.count; }, 0);
    if (need !== free) return { solved: false, placements: [], nodes: 0, exhausted: true, reason: 'area' };

    var placed = [], nodes = 0, overflow = false;

    function firstEmpty() {
      for (var i = 0; i < board.length; i++) if (board[i] === -1) return i;
      return -1;
    }
    function dfs() {
      if (++nodes > budget) { overflow = true; return false; }
      var idx = firstEmpty();
      if (idx < 0) return true;
      var r0 = Math.floor(idx / W), c0 = idx % W;
      for (var t = 0; t < types.length; t++) {
        if (!types[t].left) continue;
        var os = types[t].orients;
        for (var o = 0; o < os.length; o++) {
          var cells = os[o];
          // 行序第一格必须落在 (r0,c0)
          var dr = r0 - cells[0][0], dc = c0 - cells[0][1], ok = true, abs = [];
          for (var m = 0; m < cells.length; m++) {

   * @param {Object}   options
   * @param {Array}    options.defs            成就定义：{ id, icon, name, desc, check?(state)=>bool }
   * @param {string}   options.storageKey      localStorage key，建议带版本号，如 'lights-out-ach-v1'
   * @param {number}  [options.toastDuration]  toast 停留毫秒，默认 4200
   * @param {Function}[options.onUnlock]       每解锁一项的回调 (def) => void（可选，用于撒花/音效）

    var onUnlock = typeof options.onUnlock === 'function' ? options.onUnlock : null;

    function toastStack() {

          '<div class="ach-meta"><div class="ach-name">' + def.name + '</div>' +
          '<div class="ach-desc">' + (def.desc || '') + '</div></div>' +
          '<div class="ach-status">' + (got ? '✓ 已解锁' : '未解锁') + '</div>';
        container.appendChild(row);

      updateProgress();
    }

    updateProgress();

      check: check,        // 声明式：状态变更后调用 ach.check(state)
      unlock: unlock,      // 命令式：离散事件触发 ach.unlock(id)

      box.appendChild(row);
    });

    // 合计可达 vs 实际
    var cr = report.colorReports[focus];
    var rr = el('div', 'row');
    rr.appendChild(el('span', 'k', '全部块合计能凑出的「' + cr.label + '」格数'));
    var listTxt = cr.reachable.length <= 10
      ? '{ ' + cr.reachable.join(', ') + ' }'
      : cr.reachable[0] + ' … ' + cr.reachable[cr.reachable.length - 1] + '（共 ' + cr.reachable.length + ' 个值）';
    rr.appendChild(el('span', 'v', listTxt));
    box.appendChild(rr);

    var ar = el('div', 'row');
    ar.appendChild(el('span', 'k', '棋盘实际「' + cr.label + '」格数'));
    ar.appendChild(el('span', 'v', String(cr.actual)));
    box.appendChild(ar);

    var v = el('div', 'verdict ' + (report.proved ? 'win' : 'miss'));
    v.innerHTML = report.proved
      ? '✅ <strong>证否成功！</strong><br>' + report.best.text
      : '❌ <strong>这把武器打不穿。</strong><br>需要的数目落在能凑出的范围里，没有产生矛盾——换一把刀试试。';
    box.appendChild(v);
    return box;
  }

  function makePredict(cfg) {
    // cfg: { q, options:[{label, ok}], onAnswer(idx, ok) }
    var box = el('div', 'predict-box');
    box.appendChild(el('p', 'predict-q', '<span class="pill">先预测</span> ' + cfg.q));
    var row = el('div', 'opt-row');
    var fb = el('div', 'predict-feedback', cfg.hint || '选一个再往下走——先押注，后验证，记得才牢。');
    var answered = false;
    cfg.options.forEach(function (o, i) {
      var b = el('button', 'opt', o.label);
      b.type = 'button';
      b.addEventListener('click', function () {
        if (answered) return;
        answered = true;
        b.classList.add('chosen');
        $$('.opt', row).forEach(function (x) { x.disabled = true; });
        fb.innerHTML = o.ok
          ? '✅ 记住这个判断，等下亲手验一遍。'
          : '🤔 先记下你的选择，等下亲手验一遍——猜错才是最值钱的。';
        box.dataset.answered = '1';
        if (cfg.onAnswer) cfg.onAnswer(i, o.ok);
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    box.appendChild(fb);
    return { el: box, answered: function () { return answered; } };
  }

  // 「可点但锁定」的门禁（不用裸 disabled，否则会被当成按钮坏了）
  // ⚠️ 必须在 btn 已插入 DOM 之后调用，否则 btn.after(tag) 无处可插。
  function gate(btn, predict, scrollTo) {
    function sync() {
      if (!predict.answered()) return;
      btn.classList.remove('is-locked');
      if (btn._tag) { btn._tag.remove(); btn._tag = null; }
    }
    if (!predict.answered()) {
      btn.classList.add('is-locked');
      var tag = el('span', 'lock-tag', '🔒 先预测');
      if (btn.parentNode) { btn.after(tag); btn._tag = tag; }
    }
    btn.addEventListener('click', function (ev) {
      if (!predict.answered()) {
        ev.stopImmediatePropagation();
        ev.preventDefault();
        scrollTo.scrollIntoView({ behavior: 'smooth', block: 'center' });
        scrollTo.classList.add('flash');
        setTimeout(function () { scrollTo.classList.remove('flash'); }, 2100);
      }
    }, true);
    var mo = new MutationObserver(sync);
    mo.observe(predict.el, { attributes: true, attributeFilter: ['data-answered'] });
    return sync;
  }

  // =========================================================================
  // 模块 M1 · 黑白染色 · 不变量的诞生
  // =========================================================================
  function buildBW(stage, panel) {
    var pieceIds = ['domino', 'tet-O', 'tet-I', 'tet-L', 'tet-T', 'tet-S'];
    var cur = 'tet-T', ori = 0, pinned = [], seen = {};
    var board = makeBoard({ W: 6, H: 6, coloringId: 'checker', maxPx: 420 });
    var panelBox = el('div');

    function orients() { return E.orientations(cur, true); }
    function countOf(cells) {
      var col = board.resolved(), v = [0, 0];
      cells.forEach(function (q) { v[col.grid[q[0]][q[1]]]++; });
      return v;
    }
    function renderPanel(live) {
      panelBox.innerHTML = '';
      var c1 = el('div', 'card');
      c1.appendChild(el('div', 'card-title', '这一放盖住了'));
      c1.appendChild(el('div', 'card-body', live
        ? '<strong style="font-size:19px">黑 ' + live[1] + ' · 白 ' + live[0] + '</strong>'
        : '把鼠标（或手指）移到棋盘上试试。'));
      panelBox.appendChild(c1);

      var c2 = el('div', 'card');
      c2.appendChild(el('div', 'card-title', '我亲手试出来的黑格数'));
      var ks = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
      c2.appendChild(el('div', 'card-body', ks.length
        ? '{ ' + ks.join(', ') +' }　（点棋盘钉住一次摆放）'
        : '还没有记录。点一下棋盘，把当前摆放钉住。'));
      panelBox.appendChild(c2);

      if (S.m1spec) {
        var c3 = el('div', 'card');
        c3.appendChild(el('div', 'card-title', '🔬 全部摆法扫描结果'));
        c3.appendChild(el('div', 'card-body', S.m1spec));
        panelBox.appendChild(c3);
      }
    }

    var picker = el('div', 'rack');
    pieceIds.forEach(function (pid) {
      var b = el('button', 'piece-chip' + (pid === cur ? ' active' : ''));
      b.type = 'button';
      b.appendChild(pieceMini(pid, 8));
      b.appendChild(el('span', null, E.getPiece(pid).name));
      b.addEventListener('click', function () {
        cur = pid; ori = 0; pinned = []; seen = {}; S.m1spec = null;
        $$('.piece-chip', picker).forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        board.setPlacements([]); board.setGhost(null); renderPanel();
      });
      picker.appendChild(b);
    });

    board.grid.addEventListener('mousemove', function (ev) {
      var rc = board.cellAt(ev); if (!rc) return;
      var cells = anchorCells(orients()[ori], rc[0], rc[1], 6, 6);
      board.setGhost({ cells: cells, ok: true });
      renderPanel(countOf(cells));
    });
    board.grid.addEventListener('mouseleave', function () { board.setGhost(null); renderPanel(); });
    board.grid.addEventListener('click', function (ev) {
      var rc = board.cellAt(ev); if (!rc) return;
      var cells = anchorCells(orients()[ori], rc[0], rc[1], 6, 6);
      var v = countOf(cells);
      seen[v[1]] = 1;
      pinned.push({ pieceId: cur, cells: cells });
      if (pinned.length > 4) pinned.shift();
      board.setPlacements(pinned);
      renderPanel(v);
    });

    var rotBtn = el('button', 'tool-button', '旋转 (R)');
    rotBtn.type = 'button';
    rotBtn.addEventListener('click', function () { ori = (ori + 1) % orients().length; });
    var clrBtn = el('button', 'tool-button', '重置');
    clrBtn.type = 'button';
    clrBtn.addEventListener('click', function () {
      pinned = []; seen = {}; S.m1spec = null; board.setPlacements([]); renderPanel();
    });
    var scanBtn = el('button', 'tool-button primary', '扫描全部摆法');
    scanBtn.type = 'button';

    var predict = makePredict({
      q: '把 <strong>T 形四连方</strong>放到国际象棋染色的棋盘上，它盖住的<strong>黑格数</strong>会是……',
      options: [
        { label: '永远是 2', ok: false },
        { label: '永远是奇数', ok: true },
        { label: '什么都可能', ok: false }
      ]
    });
    scanBtn.addEventListener('click', function () {
      var sp = E.spectrum(cur, 'checker', 6, 6, true);
      var inf = sp.perColor[1], def = E.getPiece(cur);
      var n = Math.floor(36 / def.cells.length);          // 铺满 6×6 需要几块
      var boardBlack = E.colorCounts(E.resolveColoring('checker', 6, 6))[1];
      var verdict, isInv = false;
      if (inf.constant !== null) {
        verdict = '<span class="pill good">恒定 = ' + inf.constant + '</span> 不变量成立：' +
          n + ' 块合计必然是 <strong>' + (n * inf.constant) + '</strong> 个黑格。';
        isInv = true;
      } else if (inf.parity !== null) {
        verdict = '<span class="pill good">恒为' + (inf.parity ? '奇' : '偶') + '数</span> 不变量成立：' +
          n + ' 块合计的奇偶被锁死为<strong>' + ((n * inf.parity) % 2 ? '奇' : '偶') + '数</strong>。';
        isInv = true;
      } else {
        verdict = '<span class="pill bad">既不恒定，奇偶也变</span> 这套染色对它没用，总数根本算不出来。';
      }
      // 关键一步：算出来的总数，和棋盘真实黑格数对得上吗？
      var tail;
      if (inf.constant !== null) {
        tail = (n * inf.constant === boardBlack)
          ? '<span class="pill warn">但是</span> 棋盘黑格恰好也是 <strong>' + boardBlack + '</strong> 个，' +
          '<strong>严丝合缝，一点矛盾都没有</strong>。刀是好刀，可惜砍不动这块料。'
          : '棋盘黑格是 <strong>' + boardBlack + '</strong> 个，对不上 → 矛盾，铺不满！';
      } else if (inf.parity !== null) {
        tail = ((n * inf.parity) % 2 !== boardBlack % 2)
          ? '棋盘黑格是 <strong>' + boardBlack + '</strong> 个（' + (boardBlack % 2 ? '奇' : '偶') + '数），' +
          '奇偶对不上 → 矛盾，铺不满！'
          : '棋盘黑格是 <strong>' + boardBlack + '</strong> 个，奇偶正好一致，没有矛盾。';
      } else {
        tail = '';
      }
      S.m1spec = '<strong>' + def.name + '</strong> 在 6×6 上共有 <strong>' + sp.placements + '</strong> 种摆法，' +
        '盖住的黑格数只可能是 <strong>{ ' + inf.values.join(', ') + ' }</strong>。<br><br>' + verdict +
        (tail ? '<br><br>' + tail : '');
      S.sawSpectrum = true;
      if (isInv) S.sawInvariant = true;
      bump(); renderPanel();
    });

    document.addEventListener('keydown', function (ev) {
      if (S.module !== 'bw') return;
      if (ev.key === 'r' || ev.key === 'R') ori = (ori + 1) % orients().length;
    });

    var predictCard = el('div', 'card');
    predictCard.appendChild(predict.el);
    stage.appendChild(predictCard);

    var card = el('div', 'card');
    card.appendChild(el('div', 'card-title', '选一种骨牌，在棋盘上到处摆'));
    card.appendChild(picker);
    var sp2 = el('div'); sp2.style.height = '12px'; card.appendChild(sp2);
    card.appendChild(board.el);
    var ctl = el('div', 'rack'); ctl.style.marginTop = '12px';
    ctl.appendChild(rotBtn); ctl.appendChild(clrBtn); ctl.appendChild(scanBtn);
    card.appendChild(ctl);
    stage.appendChild(card);
    gate(scanBtn, predict, predict.el);   // 必须在按钮已进 DOM 之后

    stage.appendChild(makeReveal('一把染色的刀，要过两道关',
      '<strong>第一关：算得出来。</strong>某种骨牌盖住的黑格数必须<strong>恒定</strong>（1×2 永远 1 个）或者<strong>奇偶恒定</strong>（T 形永远奇数个）。' +
      '只有这样，你才敢说「9 块合计一定是多少」。忽多忽少、奇偶还变的，这套染色对它就是废的。<br><br>' +
      '<strong>第二关：算出来的还得对不上。</strong>这是最容易被忽略的一步。把六种骨牌逐个扫一遍你会发现：' +
      '在国际象棋染色下，2×2、1×4、L、S <strong>统统恒吃 2 个黑格</strong>——9 块合计 18 个，' +
      '而 6×6 的黑格恰好就是 18 个。<span class="pill warn">严丝合缝</span> 一点矛盾都挤不出来。<br><br>' +
      '唯一的例外是 <strong>T 形</strong>：它恒吃奇数个黑格，9 个奇数相加是奇数，和 18 这个偶数打架 → 一击命中。<br><br>' +
      '所以「黑白染色证不出来」不是你做错了，是<strong>刀不对</strong>。下一个实验就去换刀。'));

    renderPanel();
    panel.appendChild(panelBox);
  }

  // =========================================================================
  // 通用「选武器打靶」面板（M2 / M3 / M4-B / M5 共用）
  // =========================================================================
  function makeArmory(cfg) {
    // cfg: { board, W, H, recipe, allowFlip, chipIds, blocked, onResult(id, report) }
    var panelBox = el('div');
    var lastId = null;
    var chips = makeChips(cfg.chipIds || ALL_COLORINGS, function (id, btn) {
      lastId = id;
      cfg.board.setColoring(id);
      cfg.board.setLabels(E.getColoring(id).k > 2);
      cfg.board.setSpot(null);
      var rep = E.analyze({
        W: cfg.W, H: cfg.H, coloring: id, recipe: cfg.recipe,
        allowFlip: cfg.allowFlip, blocked: cfg.blocked
      });
      btn.classList.toggle('hit', rep.proved);
      $('.mark', btn).textContent = rep.proved ? '✅ 打穿' : '✗ 无效';
      draw(id, rep);
      if (cfg.onResult) cfg.onResult(id, rep);
    });

    function draw(id, rep) {
      panelBox.innerHTML = '';
      var c = E.getColoring(id);
      var head = el('div', 'card');
      head.appendChild(el('div', 'card-title', c.name + ' <span class="pill">' + c.family + '</span>'));
      head.appendChild(el('div', 'card-body', c.idea));
      panelBox.appendChild(head);

      var det = el('div', 'card');
      det.appendChild(el('div', 'card-title', '🔬 矛盾探测器'));
      det.appendChild(renderDetector(rep, {
        onSample: function (cells) {
          cfg.board.setSpot(cells);
          cfg.board.setPlacements([{ pieceId: 'x', cells: cells }]);
        }
      }));
      panelBox.appendChild(det);
    }

    function reset() {
      panelBox.innerHTML = '';
      panelBox.appendChild(el('div', 'card',
        '<div class="card-title">🗡️ 挑一把武器</div>' +
        '<div class="card-body">点左边任意一个染色芯片，探测器会立刻算出：这套染色下每块骨牌能吃几个某色格、' +
        '全部块合计能凑出多少、和棋盘实际数目对不对得上。</div>'));
      $$('.color-chip', chips).forEach(function (b) {
        b.classList.remove('active', 'hit'); $('.mark', b).textContent = '';
      });
      lastId = null;
    }
    reset();
    return { chips: chips, panel: panelBox, reset: reset, current: function () { return lastId; } };
  }

  function buildStripe(stage, panel) {

      options: [{ label: '能证出来', ok: false }, { label: '证不出来', ok: true }],

      '和棋盘完全吻合，<strong>一点矛盾都没有</strong>。但「没有矛盾」不等于「铺得满」，只等于「这把刀砍不动」。<br><br>' +
      '换成条形染色（一行黑一行白）：L 形横放竖放都会盖住 <strong>1 个或 3 个</strong>黑格，永远是奇数。' +
      '5 个奇数相加还是奇数，可棋盘上的黑格是 10 个，是偶数。奇 ≠ 偶，矛盾出现了。<br><br>' +
      '<strong>选染色的思路</strong>：盯住图形的形状特点。L 形的「总长 3、出头的一格在端上」使它横竖都跨奇数条纹，条形染色正好吃住这一点。'));

    panel.appendChild(armory.panel);
  }

  // =========================================================================
  // 模块 M3 · 轮换四色 · 长条克星
  // =========================================================================
  function buildCycle(stage, panel) {
    var W = 6, H = 6, recipe = [{ pieceId: 'tet-I', count: 9 }];
    var board = makeBoard({ W: W, H: H, coloringId: 'cycle4', showLabels: true, maxPx: 420 });
    var ori = 0, panelBox = el('div');

    function live(cells) {
      var col = board.resolved(), v = [0, 0, 0, 0];
      cells.forEach(function (q) { v[col.grid[q[0]][q[1]]]++; });
      return v;
    }
    function renderPanel(v) {
      panelBox.innerHTML = '';
      var c1 = el('div', 'card');
      c1.appendChild(el('div', 'card-title', '这一放盖住的四个数'));
      c1.appendChild(el('div', 'card-body', v
        ? '<strong style="font-size:17px">1×' + v[0] + '　2×' + v[1] + '　3×' + v[2] + '　4×' + v[3] + '</strong>'
        : '把 1×4 长条在棋盘上滑一滑，看它盖住的数字组合。'));
      panelBox.appendChild(c1);

      var col = E.resolveColoring('cycle4', 6, 6), counts = E.colorCounts(col);
      var c2 = el('div', 'card');
      c2.appendChild(el('div', 'card-title', '棋盘上四种数各有多少'));
      var body = el('div', 'card-body');
      var mx = Math.max.apply(null, counts);
      counts.forEach(function (n, j) {
        var row = el('div');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;margin:5px 0';
        row.appendChild(el('span', null, col.labels[j]));
        var bar = el('span');
        bar.style.cssText = 'height:14px;border-radius:3px;background:var(--accent);width:' + (n / mx * 130) + 'px';
        row.appendChild(bar);
        row.appendChild(el('strong', null, String(n)));
        body.appendChild(row);
      });
      c2.appendChild(body);
      panelBox.appendChild(c2);

      if (S.m3report) {
        var c3 = el('div', 'card');
        c3.appendChild(el('div', 'card-title', '🔬 矛盾探测器'));
        c3.appendChild(renderDetector(S.m3report, {}));
        panelBox.appendChild(c3);
      }
    }

    board.grid.addEventListener('mousemove', function (ev) {
      var rc = board.cellAt(ev); if (!rc) return;
      var cells = anchorCells(E.orientations('tet-I', false)[ori], rc[0], rc[1], W, H);
      board.setGhost({ cells: cells, ok: true });
      renderPanel(live(cells));
    });
    board.grid.addEventListener('mouseleave', function () { board.setGhost(null); renderPanel(); });

    var rotBtn = el('button', 'tool-button', '横放 / 竖放 (R)');
    rotBtn.type = 'button';
    rotBtn.addEventListener('click', function () { ori = (ori + 1) % 2; });
    document.addEventListener('keydown', function (ev) {
      if (S.module !== 'cycle') return;
      if (ev.key === 'r' || ev.key === 'R') ori = (ori + 1) % 2;
    });
    var proveBtn = el('button', 'tool-button primary', '用轮换四色证否');
    proveBtn.type = 'button';

    var predict = makePredict({
      q: '把 1×4 长条放到 1234 轮换染色上，它盖住的四个数……',
      options: [
        { label: '总是 1、2、3、4 各一个', ok: true },
        { label: '看放的位置而定', ok: false },
        { label: '总有两个一样', ok: false }
      ]
    });
    proveBtn.addEventListener('click', function () {
      S.m3report = E.analyze({ W: W, H: H, coloring: 'cycle4', recipe: recipe, allowFlip: false });
      if (S.m3report.proved) { S.cycleWin = true; bump(); }
      renderPanel();
    });

    var pc = el('div', 'card'); pc.appendChild(predict.el); stage.appendChild(pc);
    var card = el('div', 'card');
    card.appendChild(el('div', 'card-title', '6×6 棋盘 × 9 个 1×4 长条'));
    card.appendChild(board.el);
    var ctl = el('div', 'rack'); ctl.style.marginTop = '12px';
    ctl.appendChild(rotBtn); ctl.appendChild(proveBtn);
    card.appendChild(ctl);
    stage.appendChild(card);
    gate(proveBtn, predict, predict.el);   // 必须在按钮已进 DOM 之后

    stage.appendChild(makeReveal('为什么长方形要用「斜着轮换」的染色',
      '长方形的横放和竖放，是关于对角线<strong>对称</strong>的。所以要想让「无论怎么放，盖住的某色数都不变」，' +
      '染色方法自己也得<strong>关于对角线对称</strong>——沿斜线轮换正是最自然的做法。<br><br>' +
      '1×4 长条不管横放竖放，都恰好跨过连续 4 条斜线，所以必然盖住 1、2、3、4 各一个。' +
      '9 块合计就必须是 9 个 1、9 个 2、9 个 3、9 个 4；可 6×6 上四种数是 <strong>9 / 10 / 9 / 8</strong>，不一样多，矛盾。<br><br>' +
      '把这个想法收窄：只把「2」留成黑格（斜线型1），每块长条恰好吃 1 个黑格，9 块吃 9 个，' +
      '棋盘却有 10 个黑格——同一个矛盾，说法更短。<strong>要铺 1×k 的长条，就用周期 k 的斜线染色。</strong>'));

    renderPanel();
    panel.appendChild(panelBox);
  }

  // =========================================================================
  // 模块 M4 · 靶场：9 个四连方 vs 6×6（核心）
  // =========================================================================
  var ARENA = [
    {
      id: 1, label: '① 9 个 2×2', recipe: [{ pieceId: 'tet-O', count: 9 }], allowFlip: false,
      answer: true, q: '9 个 <b>2×2 方块</b>能铺满 6×6 吗？'
    },
    {
      id: 2, label: '② 9 个 L 形', recipe: [{ pieceId: 'tet-L', count: 9 }], allowFlip: true,
      answer: false, q: '9 个 <b>L 形四连方</b>（可旋转翻转）能铺满 6×6 吗？'
    },
    {
      id: 3, label: '③ 9 个 1×4', recipe: [{ pieceId: 'tet-I', count: 9 }], allowFlip: false,
      answer: false, q: '9 个 <b>1×4 长条</b>（可旋转）能铺满 6×6 吗？'
    },
    {
      id: 4, label: '④ 9 个 S 形', recipe: [{ pieceId: 'tet-S', count: 9 }], allowFlip: true,
      answer: false, q: '9 个 <b>S 形四连方</b>（可旋转翻转）能铺满 6×6 吗？'
    },
    {
      id: 5, label: '⑤ 2 个 2×2 + 7 个 1×4',
      recipe: [{ pieceId: 'tet-O', count: 2 }, { pieceId: 'tet-I', count: 7 }], allowFlip: false,
      answer: false, q: '<b>2 个 2×2</b> 加 <b>7 个 1×4</b>（可旋转）能铺满 6×6 吗？'
    }
  ];

  function buildArena(stage, panel) {
    var lvl = ARENA[0], phase = 'lay', ori = 0, flip = false, curPiece = null;
    var placements = [], panelBox = el('div'), armory = null;
    var board = makeBoard({ W: 6, H: 6, coloringId: null, maxPx: 430 });
    board.grid.classList.add('clickable');

    var levelBar = el('div', 'level-bar');
    var stageCard = el('div', 'card');
    var pickerHost = el('div', 'rack');
    var ctlHost = el('div', 'rack');
    var armoryHost = el('div');
    var predictHost = el('div', 'card');
    var revealHost = el('div');

    function remaining() {
      var used = {};
      placements.forEach(function (p) { used[p.pieceId] = (used[p.pieceId] || 0) + 1; });
      return lvl.recipe.map(function (it) {
        return { pieceId: it.pieceId, left: it.count - (used[it.pieceId] || 0), total: it.count };
      });
    }
    function orients() { return E.orientations(curPiece, lvl.allowFlip); }
    function anyMoveLeft() {
      var rem = remaining().filter(function (x) { return x.left > 0; });
      if (!rem.length) return false;
      for (var i = 0; i < rem.length; i++) {
        var os = E.orientations(rem[i].pieceId, lvl.allowFlip);
        for (var o = 0; o < os.length; o++) {
          var ps = E.placementsOf(os[o], 6, 6);
          for (var j = 0; j < ps.length; j++) {
            if (cellsFree(ps[j], placements, {}, 6, 6)) return true;
          }
        }
      }
      return false;
    }

    function renderPicker() {
      pickerHost.innerHTML = '';
      remaining().forEach(function (rm) {
        var b = el('button', 'piece-chip' + (rm.pieceId === curPiece ? ' active' : ''));
        b.type = 'button';
        b.appendChild(pieceMini(rm.pieceId, 8));
        b.appendChild(el('span', null, E.getPiece(rm.pieceId).name + ' 剩 ' + rm.left));
        b.disabled = rm.left <= 0;
        b.addEventListener('click', function () { curPiece = rm.pieceId; ori = 0; renderPicker(); });
        pickerHost.appendChild(b);
      });
    }

    function renderPanel() {
      panelBox.innerHTML = '';
      if (phase === 'lay') {
        var filled = placements.reduce(function (a, p) { return a + p.cells.length; }, 0);
        var c = el('div', 'card');
        c.appendChild(el('div', 'card-title', '手铺进度'));
        c.appendChild(el('div', 'card-body',
          '已放 <strong>' + placements.length + '</strong> 块，覆盖 <strong>' + filled + '</strong> / 36 格，还剩 <strong>' + (36 - filled) + '</strong> 格空着。<br>' +
          '<span class="pill">点棋盘放置</span> <span class="pill">点已放的块可取回</span>'));
        panelBox.appendChild(c);
        if (S.arenaHint) {
          var h = el('div', 'card');
          h.appendChild(el('div', 'card-title', '🧱 卡住了'));
          h.appendChild(el('div', 'card-body', S.arenaHint));
          panelBox.appendChild(h);
        }
      } else if (armory) {
        panelBox.appendChild(armory.panel);
      }
      if (S.solveText) {
        var sv = el('div', 'card');
        sv.appendChild(el('div', 'card-title', '🐌 穷举验证'));
        sv.appendChild(el('div', 'card-body', S.solveText));
        panelBox.appendChild(sv);
      }
    }

    var predict = null;
    function setLevel(L) {
      lvl = L; phase = 'lay'; ori = 0; placements = []; curPiece = L.recipe[0].pieceId;
      S.arenaHint = null; S.solveText = null;
      $$('.level-btn', levelBar).forEach(function (b) {
        b.classList.toggle('active', +b.dataset.id === L.id);
      });
      board.setColoring(null); board.setLabels(false); board.setPlacements([]); board.setGhost(null); board.setSpot(null);

      armory = makeArmory({
        board: board, W: 6, H: 6, recipe: L.recipe, allowFlip: L.allowFlip,
        onResult: function (id, rep) {
          if (rep.proved) {
            if (!S.arenaCleared[L.id]) {
              if (!S.arenaTried[L.id]) S.oneShot = true;
              S.arenaCleared[L.id] = 'proved';
            }
          }
          S.arenaTried[L.id] = (S.arenaTried[L.id] || 0) + 1;
          bump(); renderLevelBar();
        }
      });
      armoryHost.innerHTML = '';
      armoryHost.appendChild(armory.chips);

      predictHost.innerHTML = '';
      predict = makePredict({
        q: L.q,
        options: [{ label: '能铺满', ok: L.answer === true }, { label: '铺不满', ok: L.answer === false }],
        onAnswer: function () { syncGate(); }
      });
      predictHost.appendChild(predict.el);

      renderPicker(); renderPhase(); renderPanel(); renderReveal();
    }

    function renderLevelBar() {
      $$('.level-btn', levelBar).forEach(function (b) {
        var done = S.arenaCleared[+b.dataset.id];
        var t = $('.tick', b);
        if (done && !t) b.appendChild(el('span', 'tick', '✓'));
      });
    }

    var toProof = el('button', 'tool-button primary', '卡住了 → 我要证明它铺不满');
    toProof.type = 'button';
    var backLay = el('button', 'tool-button', '← 回去继续铺');
    backLay.type = 'button';
    var rotBtn = el('button', 'tool-button', '旋转 (R)');
    rotBtn.type = 'button';
    var flipBtn = el('button', 'tool-button', '翻转 (F)');
    flipBtn.type = 'button';
    var resetBtn = el('button', 'tool-button', '重置');
    resetBtn.type = 'button';
    var solveBtn = el('button', 'tool-button', '穷举验证');
    solveBtn.type = 'button';

    function renderPhase() {
      ctlHost.innerHTML = '';
      if (phase === 'lay') {
        pickerHost.hidden = false;
        armoryHost.hidden = true;
        ctlHost.appendChild(rotBtn);
        if (lvl.allowFlip) ctlHost.appendChild(flipBtn);
        ctlHost.appendChild(resetBtn);
        ctlHost.appendChild(toProof);
        board.grid.classList.add('clickable');
      } else {
        pickerHost.hidden = true;
        armoryHost.hidden = false;
        ctlHost.appendChild(backLay);
        ctlHost.appendChild(solveBtn);
        board.grid.classList.remove('clickable');
      }
      syncGate();
    }

    var gateSync = null;
    function syncGate() {
      if (!predict) return;
      var okAnswered = predict.answered();
      [rotBtn, flipBtn, resetBtn, toProof].forEach(function (b) {
        b.classList.toggle('is-locked', !okAnswered);
      });
    }
    [rotBtn, flipBtn, resetBtn, toProof].forEach(function (b) {
      b.addEventListener('click', function (ev) {
        if (predict && !predict.answered()) {
          ev.stopImmediatePropagation(); ev.preventDefault();
          predictHost.scrollIntoView({ behavior: 'smooth', block: 'center' });
          predict.el.classList.add('flash');
          setTimeout(function () { predict.el.classList.remove('flash'); }, 2100);
        }
      }, true);
    });

    rotBtn.addEventListener('click', function () { ori = (ori + 1) % orients().length; });
    flipBtn.addEventListener('click', function () { ori = (ori + 1) % orients().length; });
    resetBtn.addEventListener('click', function () {
      placements = []; S.arenaHint = null; board.setPlacements([]); renderPicker(); renderPanel();
    });
    toProof.addEventListener('click', function () {
      phase = 'proof'; board.setPlacements([]); armory.reset(); renderPhase(); renderPanel();
    });
    backLay.addEventListener('click', function () {
      phase = 'lay'; board.setColoring(null); board.setLabels(false); board.setSpot(null);
      board.setPlacements(placements); renderPhase(); renderPanel();
    });
    solveBtn.addEventListener('click', function () {
      setStatus('穷举中…');
      setTimeout(function () {
        var res = E.solve({ W: 6, H: 6, recipe: lvl.recipe, allowFlip: lvl.allowFlip, budget: 900000 });
        if (res.solved) {
          S.solveText = '搜到了一种真实铺法（已画在棋盘上）——所以这一问的答案是「<strong>能</strong>」。' +
            '染色法打不穿它，不是因为你选错了刀，而是因为<strong>它本来就铺得满</strong>。';
          board.setColoring(null); board.setLabels(false);
          board.setPlacements(res.placements);
          if (!S.arenaCleared[lvl.id]) { S.arenaCleared[lvl.id] = 'built'; bump(); renderLevelBar(); }
        } else if (res.exhausted) {
          S.solveText = '搜遍全部 <strong>' + res.nodes + '</strong> 种摆法，一种都不成立——和染色法的结论一致。' +
            '但注意：穷举只告诉你「没找到」，染色告诉你「<strong>为什么永远找不到</strong>」。';
        } else {
          S.solveText = '已经试掉 <strong>' + res.nodes + '</strong> 种摆法全部失败，而搜索空间还没走完。' +
            '这就是染色法的价值——它不需要试。';
        }
        setStatus('可操作'); renderPanel();
      }, 30);
    });

    document.addEventListener('keydown', function (ev) {
      if (S.module !== 'arena' || phase !== 'lay') return;
      if (ev.key === 'r' || ev.key === 'R') ori = (ori + 1) % orients().length;
      if ((ev.key === 'f' || ev.key === 'F') && lvl.allowFlip) ori = (ori + 1) % orients().length;
    });

    board.grid.addEventListener('mousemove', function (ev) {
      if (phase !== 'lay' || !curPiece) return;
      var rc = board.cellAt(ev); if (!rc) return;
      var cells = anchorCells(orients()[ori], rc[0], rc[1], 6, 6);
      board.setGhost({ cells: cells, ok: cellsFree(cells, placements, {}, 6, 6) });
    });
    board.grid.addEventListener('mouseleave', function () { if (phase === 'lay') board.setGhost(null); });
    board.grid.addEventListener('click', function (ev) {
      if (phase !== 'lay') return;
      var rc = board.cellAt(ev); if (!rc) return;
      // 点已放的块 → 取回
      for (var i = 0; i < placements.length; i++) {
        for (var j = 0; j < placements[i].cells.length; j++) {
          if (placements[i].cells[j][0] === rc[0] && placements[i].cells[j][1] === rc[1]) {
            placements.splice(i, 1);
            S.arenaHint = null;
            board.setPlacements(placements); renderPicker(); renderPanel();
            return;
          }
        }
      }
      if (!curPiece) return;
      var rem = remaining().filter(function (x) { return x.pieceId === curPiece; })[0];
      if (!rem || rem.left <= 0) return;
      var cells = anchorCells(orients()[ori], rc[0], rc[1], 6, 6);
      if (!cellsFree(cells, placements, {}, 6, 6)) return;
      placements.push({ pieceId: curPiece, cells: cells });
      board.setPlacements(placements);
      // 自动切到还有剩余的骨牌
      var r2 = remaining().filter(function (x) { return x.left > 0; });
      if (r2.length && !r2.some(function (x) { return x.pieceId === curPiece; })) { curPiece = r2[0].pieceId; ori = 0; }
      renderPicker();

      var filled = placements.reduce(function (a, p) { return a + p.cells.length; }, 0);
      if (filled === 36) {
        S.arenaHint = '🎉 你把它铺满了！这一问的答案就是「能」。';
        if (!S.arenaCleared[lvl.id]) { S.arenaCleared[lvl.id] = 'built'; bump(); renderLevelBar(); }
      } else if (!anyMoveLeft()) {
        S.arenaHint = '再也放不下任何一块了，还剩 <strong>' + (36 - filled) + '</strong> 格空着。<br>' +
          '但「我试了很多次都失败」不是证明——换个思路：<strong>去证明它永远铺不满</strong>。';
        S.stuck = true; bump();
      }
      renderPanel();
    });

    function renderReveal() {
      revealHost.innerHTML = '';
      revealHost.appendChild(makeReveal('这五个小问，各要用哪把刀',
        '<strong>① 9 个 2×2</strong>：唯一的「能」。9 个 2×2 正好拼成 6×6，所有染色都打不穿它——这时候该去找构造，而不是继续换刀。<br><br>' +
        '<strong>② 9 个 L 形</strong>：黑白染色下 L 恒吃 2 黑 2 白，无效。改用<strong>条形染色</strong>，L 恒吃奇数个黑格，9 个奇数相加是奇数，可黑格有 18 个。<br><br>' +

  function buildSandbox(stage, panel) {
    var W = 6, H = 6;
    var grid = [];
    var recipe = [{ pieceId: 'tet-L', count: 9 }];
    var panelBox = el('div');
    var board = makeBoard({ W: W, H: H, maxPx: 420 });
    board.grid.classList.add('clickable');
    var painted = false;

    function blankGrid() {
      grid = [];
      for (var r = 0; r < H; r++) { var row = []; for (var c = 0; c < W; c++) row.push(0); grid.push(row); }
    }
    function loadTemplate(id) {
      var col = E.resolveColoring(id, W, H);
      grid = col.grid.map(function (row) { return row.map(function (v) { return col.k > 2 ? (v === 1 ? 1 : 0) : v; }); });
      painted = false;
      board.setCustom(grid); refresh();
    }
    function area() { return recipe.reduce(function (a, it) { return a + E.getPiece(it.pieceId).cells.length * it.count; }, 0); }

    function refresh() {
      board.setCustom(grid);
      panelBox.innerHTML = '';
      var need = area(), have = W * H;
      var head = el('div', 'card');
      head.appendChild(el('div', 'card-title', '配方 vs 棋盘'));
      head.appendChild(el('div', 'card-body',
        '骨牌总格数 <strong>' + need + '</strong>　棋盘格数 <strong>' + have + '</strong>' +
        (need === have ? '　<span class="pill good">对得上</span>' : '　<span class="pill bad">对不上</span>')));
      panelBox.appendChild(head);

      var rep = null;
      try {
        rep = E.analyze({
          W: W, H: H,
          coloring: { id: 'custom', name: '自定义', k: 2, labels: ['白', '黑'], grid: grid },
          recipe: recipe, allowFlip: true
        });
      } catch (e) { /* 骨牌放不进这么小的棋盘 */ }

      var det = el('div', 'card');
      det.appendChild(el('div', 'card-title', '🔬 矛盾探测器'));
      if (!rep) {
        det.appendChild(el('div', 'card-body', '有骨牌放不进这个尺寸的棋盘，先调大棋盘或换骨牌。'));
      } else {
        det.appendChild(renderDetector(rep, { onSample: function (cells) { board.setSpot(cells); } }));
        if (rep.proved && rep.best.type !== 'area' && painted) { S.sandboxWin = true; bump(); }
      }
      panelBox.appendChild(det);
    }

    board.grid.addEventListener('click', function (ev) {
      var rc = board.cellAt(ev); if (!rc) return;
      grid[rc[0]][rc[1]] = grid[rc[0]][rc[1]] ? 0 : 1;
      painted = true;
      board.setSpot(null);
      refresh();
    });

    // 尺寸滑杆
    function slider(label, val, min, max, onChange) {
      var row = el('div', 'slider-row');
      row.appendChild(el('span', null, label));
      var i = el('input'); i.type = 'range'; i.min = min; i.max = max; i.value = val; i.step = 1;
      var v = el('span', 'val', String(val));
      i.addEventListener('input', function () { v.textContent = i.value; onChange(+i.value); });
      row.appendChild(i); row.appendChild(v);
      return row;
    }
    var sizeCard = el('div', 'card');
    sizeCard.appendChild(el('div', 'card-title', '① 定棋盘'));
    sizeCard.appendChild(slider('宽', W, 4, 10, function (v) { W = v; blankGrid(); board.resize(W, H, grid); refresh(); }));
    sizeCard.appendChild(slider('高', H, 4, 10, function (v) { H = v; blankGrid(); board.resize(W, H, grid); refresh(); }));

    var tplRow = el('div', 'rack');
    tplRow.style.marginTop = '8px';
    ALL_COLORINGS.forEach(function (id) {
      var c = E.getColoring(id);
      var b = el('button', 'tool-button', c.name);
      b.type = 'button';
      b.style.cssText = 'min-height:34px;padding:0 10px;font-size:12px';

      tplRow.appendChild(b);

    paintCard.appendChild(el('div', 'card-title', '② 涂染色'));
    paintCard.appendChild(el('div', 'card-body', '直接<strong>点棋盘格子</strong>切换黑白；也可以先载入一套标准染色，再自己改。'));
    paintCard.appendChild(tplRow);

    var recipeCard = el('div', 'card');
    recipeCard.appendChild(el('div', 'card-title', '③ 配骨牌'));
    var recipeBody = el('div');
    var numEls = {};
    function countOf(pid) {
      var x = recipe.filter(function (r) { return r.pieceId === pid; })[0];
      return x ? x.count : 0;
    }
    // 只重建一次；之后 +/− 就地改数字，不重建 DOM（否则连点会打到已被替换的旧节点上）
    function renderRecipe() {
      recipeBody.innerHTML = '';
      numEls = {};
      E.PIECES.forEach(function (p) {
        var row = el('div', 'recipe-row');
        var nm = el('div', 'nm');
        nm.appendChild(pieceMini(p.id, 8));
        nm.appendChild(el('span', null, p.name));
        row.appendChild(nm);
        var minus = el('button', 'step-btn', '−'); minus.type = 'button';
        var num = el('span', 'n', String(countOf(p.id)));
        var plus = el('button', 'step-btn', '+'); plus.type = 'button';
        minus.addEventListener('click', function () { setCount(p.id, Math.max(0, countOf(p.id) - 1)); });
        plus.addEventListener('click', function () { setCount(p.id, countOf(p.id) + 1); });
        row.appendChild(minus); row.appendChild(num); row.appendChild(plus);
        numEls[p.id] = num;
        recipeBody.appendChild(row);
      });
    }
    function setCount(pid, n) {
      recipe = recipe.filter(function (x) { return x.pieceId !== pid; });
      if (n > 0) recipe.push({ pieceId: pid, count: n });
      if (numEls[pid]) numEls[pid].textContent = String(n);
      refresh();

      '做法通常是「照着图形的形状去设计周期」：<br>' +
      '· 图形是 1×k 长条 → 周期 k 的斜线<br>' +

      (got === tot ? '全部拿下 —— 你把这一讲的每条主线都亲手走过了。' : '还有没走到的实验，回去把它们打穿。');
    c.appendChild(body);
    p.appendChild(c);
    panel.appendChild(p);
  }

  // =========================================================================
  // 路由
  // =========================================================================
  var MODULES = [
    { id: 'intro', idx: '00', title: '染色法是什么', build: buildIntro, prompt: '先让电脑用穷举法硬试，再用染色法看一眼——比较两者花的力气。' },
    { id: 'bw', idx: '01', title: '黑白染色 · 不变量的诞生', build: buildBW, prompt: '在棋盘上到处摆同一块骨牌，盯住它盖住的黑格数：它是恒定的、定奇偶的，还是什么都可能？' },
    { id: 'stripe', idx: '02', title: '条形染色 · 当黑白失效', build: buildStripe, prompt: '先用黑白染色试，看探测器怎么说；证不出来的时候，才知道为什么要换刀。' },
    { id: 'cycle', idx: '03', title: '轮换四色 · 长条克星', build: buildCycle, prompt: '滑动 1×4 长条，数它盖住的四个数字——横放竖放都试试。' },
    { id: 'arena', idx: '04', title: '靶场：9 个四连方 vs 6×6', build: buildArena, prompt: '先亲手铺，铺到放不下为止；然后挑一把染色的刀，把「铺不满」证死。' },
    { id: 'big', idx: '05', title: '大棋盘挑战', build: buildBig, prompt: '棋盘变成 8×8、10×10，穷举开始吃力，染色法却一点不受影响。' },
    { id: 'sandbox', idx: '06', title: '自由染色沙盘', build: buildSandbox, prompt: '自己涂一套染色、配一套骨牌，看看你造的刀能不能砍动它。' },
    { id: 'final', idx: '07', title: '总结闯关', build: buildFinal, prompt: '先把卡片标题当题目自己复述，再点开对照；然后做小测。' }
  ];

  function setStatus(t) { $('#statusText').textContent = t; }

  function go(id) {
    var m = MODULES.filter(function (x) { return x.id === id; })[0] || MODULES[0];
    S.module = m.id;
    $$('.module-item').forEach(function (b) { b.classList.toggle('active', b.dataset.mid === m.id); });
    $('#modKicker').textContent = '实验 ' + m.idx;
    $('#modTitle').textContent = m.title;
    $('#promptText').textContent = m.prompt;
    setStatus('可操作');
    var stage = $('#stageHost'), panel = $('#panelHost');
    stage.innerHTML = ''; panel.innerHTML = '';
    m.build(stage, panel);
    window.scrollTo({ top: 0 });
  }

  function boot() {
    var list = $('#moduleList');
    MODULES.forEach(function (m) {
      var b = el('button', 'module-item');
      b.type = 'button'; b.dataset.mid = m.id;
      b.appendChild(el('span', 'module-index', m.idx));
      b.appendChild(el('span', null, m.title));
      b.addEventListener('click', function () { go(m.id); });
      list.appendChild(b);
    });
    $('#trophyBtn').addEventListener('click', function () {
      ach.renderList($('#achList'));
      $('#achModal').hidden = false;
    });
    $('#achClose').addEventListener('click', function () { $('#achModal').hidden = true; });
    $('#achModal').addEventListener('click', function (ev) {
      if (ev.target === $('#achModal')) $('#achModal').hidden = true;
    });
    S.arenaTried = {};
    bump();
    go('intro');
  }

  window.__coloringLab = { S: S, go: go, engine: E, modules: MODULES };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

  </script>
  </body>
</html>
